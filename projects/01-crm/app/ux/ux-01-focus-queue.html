<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نمونه UX ۰۱ · صف تمرکز</title>
<style>
@font-face { font-family: "Shoor"; src: url("../../themes/mesh/fonts/shoor/ShoorRounded-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "Shoor"; src: url("../../themes/mesh/fonts/shoor/ShoorRounded-Medium.ttf"); font-weight: 500; }
@font-face { font-family: "Shoor"; src: url("../../themes/mesh/fonts/shoor/ShoorRounded-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "Shoor"; src: url("../../themes/mesh/fonts/shoor/ShoorRounded-Bold.ttf"); font-weight: 700; }
:root { --ink:#17303f; --muted:#637f8f; --accent:#4a93c9; --accent-d:#357bb0; --danger:#b42318; --ok:#15803d; --line:rgba(255,255,255,.95); --glass:rgba(255,255,255,.45); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Shoor", system-ui, sans-serif; color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
  background-color:#fbfdfe; background-image: radial-gradient(at 10% 10%, #e8f4fb 0, transparent 55%), radial-gradient(at 90% 14%, #f4fafd 0, transparent 55%), radial-gradient(at 78% 90%, #e2eef9 0, transparent 55%), radial-gradient(at 16% 88%, #e6f6f9 0, transparent 55%); background-attachment: fixed; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: 26px; backdrop-filter: blur(26px) saturate(140%); -webkit-backdrop-filter: blur(26px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 10px 30px rgba(20,60,100,.08); }
.wrap { width: min(640px, 100%); display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; }
.head h1 { font-size: 20px; }
.head .count { color: var(--muted); font-size: 14px; }
.bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.card { padding: 26px 24px; display: flex; flex-direction: column; gap: 16px; min-height: 320px; }
.name { font-size: 26px; font-weight: 700; }
.meta { color: var(--muted); font-size: 15px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 13px; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid var(--line); }
.chip.warn { color: var(--danger); font-weight: 600; }
.big { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { min-height: 56px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,.65); font-weight: 600; font-size: 17px; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: transform .08s, background .15s; }
.btn:hover { background: rgba(255,255,255,.95); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 8px 18px rgba(74,147,201,.3); }
.btn.primary:hover { background: var(--accent-d); }
.btn.ghost { background: transparent; border-color: transparent; font-weight: 500; color: var(--muted); min-height: 44px; font-size: 15px; }
.section { font-size: 14px; color: var(--muted); }
.results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.res[aria-pressed="true"] { background: var(--ok); color: #fff; border-color: var(--ok); }
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.days .btn { min-height: 46px; font-size: 15px; }
.days .btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.foot { display: flex; justify-content: space-between; align-items: center; padding: 0 6px; }
.done { text-align: center; padding: 40px 24px; display: none; flex-direction: column; gap: 10px; }
.done.on { display: flex; }
.done h2 { font-size: 24px; }
.done p { color: var(--muted); }
.note { color: var(--muted); font-size: 13px; text-align: center; }
@media (max-width: 520px) { .name { font-size: 22px; } .big { grid-template-columns: 1fr; } .results { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="glass head">
    <h1>کارهای امروز</h1>
    <span class="count" id="count"></span>
  </header>
  <div class="bar" aria-hidden="true"><i id="progress"></i></div>

  <article class="glass card" id="card" aria-live="polite">
    <div class="name" id="name"></div>
    <div class="meta" id="meta"></div>
    <div class="chips" id="chips"></div>

    <div class="big">
      <a class="btn primary" id="call" href="#">تماس</a>
      <a class="btn" id="wa" href="#" target="_blank" rel="noopener">واتساپ</a>
    </div>

    <div class="section">نتیجه‌ی تماس</div>
    <div class="results" role="group" aria-label="نتیجه‌ی تماس">
      <button class="btn res" type="button" data-res="answered" aria-pressed="true">پاسخ داد</button>
      <button class="btn res" type="button" data-res="voicemail" aria-pressed="false">پیام گذاشتم</button>
      <button class="btn res" type="button" data-res="nores" aria-pressed="false">پاسخ نداد</button>
    </div>

    <div class="section">پیگیری بعدی</div>
    <div class="days" role="group" aria-label="پیگیری بعدی">
      <button class="btn" type="button" data-days="1" aria-pressed="false">فردا</button>
      <button class="btn" type="button" data-days="2" aria-pressed="true">۲ روز</button>
      <button class="btn" type="button" data-days="7" aria-pressed="false">یک هفته</button>
      <button class="btn" type="button" data-days="14" aria-pressed="false">دو هفته</button>
    </div>
  </article>

  <div class="foot">
    <button class="btn ghost" id="skip" type="button">بعدی، این یکی بماند</button>
    <button class="btn primary" id="save" type="button" style="min-height:50px;padding:0 26px">ثبت و ادامه</button>
  </div>

  <section class="glass done" id="done" aria-live="polite">
    <h2>کارهای امروز تمام شد</h2>
    <p>همه‌ی پیگیری‌های امروز ثبت شدند.</p>
  </section>
  <div class="note">این نمونه با داده‌ی برنامه‌ی اصلی (کلید crm-app-v1) همگام است.</div>
</div>

<script>
(function () {
  "use strict";
  const DAY = 86400000, KEY = "crm-app-v1";
  const STAGES = ["جدید", "در تماس", "پیشنهاد", "برنده"];
  const $ = (id) => document.getElementById(id);
  const fa = (n) => Number(n).toLocaleString("fa-IR");
  const money = (n) => n ? fa(n) + " تومان" : "بدون مبلغ";
  const waNumber = (p) => "98" + p.slice(1);

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !Array.isArray(state.leads)) {
    const now = Date.now();
    state = { nextId: 9, lastDeleted: null, leads: [
      { id: 3, name: "کافه بهار", phone: "09121110003", source: "معرفی دوستان", stage: 1, amount: 40000000, next: now - DAY * 2 },
      { id: 4, name: "دفتر حقوقی سپهر", phone: "09121110004", source: "تماس ورودی", stage: 1, amount: 65000000, next: now },
      { id: 8, name: "کلینیک نیلوفر", phone: "09121110008", source: "اینستاگرام", stage: 1, amount: 18000000, next: now },
      { id: 1, name: "فروشگاه ماه", phone: "09121110001", source: "اینستاگرام", stage: 0, amount: 0, next: now + DAY }
    ]};
  }

  const todo = () => state.leads.filter((l) => l.stage < 3 && Math.ceil((l.next - Date.now()) / DAY) <= 0).sort((a, b) => a.next - b.next);
  let queue = todo(), idx = 0, result = "answered", days = 2, total = queue.length;

  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

  function show() {
    if (idx >= queue.length) {
      $("card").style.display = "none"; $("done").classList.add("on");
      $("count").textContent = fa(total) + " از " + fa(total);
      $("progress").style.width = "100%";
      $("skip").style.visibility = "hidden"; $("save").style.visibility = "hidden";
      return;
    }
    const l = queue[idx];
    $("count").textContent = fa(idx + 1) + " از " + fa(total);
    $("progress").style.width = ((idx / total) * 100) + "%";
    $("name").textContent = l.name;
    $("meta").textContent = STAGES[l.stage] + " · " + fa(l.phone) + " · " + (l.amount ? money(l.amount) : "بدون مبلغ");
    const chips = $("chips"); chips.textContent = "";
    const c1 = document.createElement("span"); c1.className = "chip"; c1.textContent = l.source; chips.appendChild(c1);
    const c2 = document.createElement("span"); c2.className = "chip warn"; c2.textContent = "پیگیری امروز";
    chips.appendChild(c2);
    $("call").href = "tel:" + l.phone;
    $("wa").href = "https://wa.me/" + waNumber(l.phone);
    result = "answered"; days = 2;
    setPressed(".res", "res", result); setPressed(".days .btn", "days", days);
  }
  function setPressed(sel, attr, val) {
    document.querySelectorAll(sel).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset[attr] == val)));
  }

  document.querySelectorAll(".res").forEach((b) => b.addEventListener("click", () => { result = b.dataset.res; setPressed(".res", "res", result); }));
  document.querySelectorAll(".days .btn").forEach((b) => b.addEventListener("click", () => { days = Number(b.dataset.days); setPressed(".days .btn", "days", days); }));

  $("save").addEventListener("click", () => {
    const l = queue[idx]; if (!l) return;
    l.next = Date.now() + days * DAY;
    if (result === "answered" && l.stage === 0) l.stage = 1;
    save();
    idx++; show();
  });
  $("skip").addEventListener("click", () => { idx++; show(); });

  // کیبورد: Enter ثبت، → بعدی
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !/BUTTON|A/.test(document.activeElement.tagName)) { e.preventDefault(); $("save").click(); }
    if (e.key === "ArrowLeft") $("skip").click();
  });

  if (!queue.length) { total = 0; }
  show();
})();
</script>
</body>
</html>
