<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff1fb">
<meta name="description" content="CRM ساده؛ آفلاین‌اول، داده روی دستگاه، برای پنج کسب‌وکار نمونه.">
<title>CRM ساده</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
<a class="skip" href="#view">رفتن به محتوا</a>

<section id="start" class="start" aria-labelledby="startTitle" hidden>
  <header class="start-head glass">
    <h1 id="startTitle">CRM ساده</h1>
    <p>یک کسب‌وکار نمونه را انتخاب کن. داده‌ها روی همین دستگاه ذخیره می‌شوند و بدون اینترنت کار می‌کنند.</p>
  </header>
  <div id="bizGrid" class="biz-grid"></div>
  <p class="footnote">همه‌ی اطلاعات نمونه ساختگی‌اند.</p>
</section>

<div id="shell" class="shell" hidden>
  <aside id="side" class="side glass" aria-label="منوی اصلی">
    <div class="brand">CRM <span>ساده</span></div>
    <nav id="navList" class="nav-list"></nav>
  </aside>

  <div class="main">
    <header class="topbar glass">
      <div class="title-row">
        <div class="title-box">
          <h1 id="pageTitle"></h1>
          <p id="pageSub"></p>
        </div>
        <button id="toggleSide" class="icon-btn" type="button" aria-expanded="false" aria-controls="side" aria-label="باز و بسته کردن منو">☰</button>
      </div>
      <div class="top-tools">
        <input id="q" class="input search" type="search" placeholder="جستجوی نام یا موبایل (کلید /)" aria-label="جستجو" autocomplete="off">
        <div id="filters" class="chips" role="group" aria-label="فیلتر فهرست"></div>
        <div id="headerActions" class="header-actions"></div>
      </div>
    </header>

    <div class="status-line" aria-live="polite">
      <span id="netState" class="pill"></span>
      <span id="saveState" class="pill"></span>
    </div>

    <main id="view" class="content" tabindex="-1"></main>
    <footer id="footnote" class="footnote"></footer>
  </div>
</div>

<div id="layer"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="printArea" class="print-area" aria-hidden="true"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
